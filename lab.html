<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>X Growth OS — Growth Lab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1>Growth Lab</h1>
  <span class="badge">Lab</span>
</header>

<div class="container">

  <section class="block">
    <div class="chart-box">
      <h3>🧪 Content Pattern Analysis</h3>
      <p style="font-size:12px; color:var(--muted);">
        Analisis otomatis berdasarkan topik yang lu catat di Content Database & Daily Journal.
      </p>
    </div>
  </section>

  <section class="block">
    <h2>Rata-Rata Performa per Kategori</h2>
    <div class="chart-box">
      <canvas id="chartCategory" height="200"></canvas>
    </div>
  </section>

  <section class="block">
    <h2>Ranking Kategori</h2>
    <div id="categoryRanking"></div>
  </section>

  <section class="block">
    <h2>Pola yang Terdeteksi</h2>
    <div id="patternInsights"></div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/lab.js"></script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
</script>
</body>
</html>
