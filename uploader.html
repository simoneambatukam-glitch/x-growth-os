<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>X Growth OS — Uploader</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1>Screenshot Analytics</h1>
  <span class="badge">Upload</span>
</header>

<div class="container">

  <section class="block">
    <div class="chart-box">
      <h3>Upload Screenshot Analytics X</h3>
      <p style="font-size:12px; color:var(--muted); margin-bottom:12px;">
        Upload screenshot dari tab Analytics di X. Sistem bakal coba baca angkanya otomatis.
      </p>

      <input type="file" id="inpFile" accept="image/*" style="display:none;">
      <button id="btnPick" class="btn-primary">Pilih Screenshot</button>

      <div id="previewBox" style="margin-top:14px; display:none;">
        <img id="imgPreview" style="width:100%; border-radius:10px; border:1px solid var(--border);">
      </div>

      <div id="ocrStatus" style="margin-top:10px; font-size:13px; color:var(--muted);"></div>
    </div>
  </section>

  <section class="block" id="resultSection" style="display:none;">
    <h2>Hasil Ekstraksi (Periksa & Edit)</h2>
    <div class="chart-box">
      <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="extDate">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Followers</label>
          <input type="number" id="extFollowers" placeholder="0">
        </div>
        <div class="form-group">
          <label>Impressions</label>
          <input type="number" id="extImpressions" placeholder="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Likes</label>
          <input type="number" id="extLikes" placeholder="0">
        </div>
        <div class="form-group">
          <label>Reposts</label>
          <input type="number" id="extReposts" placeholder="0">
        </div>
        <div class="form-group">
          <label>Replies</label>
          <input type="number" id="extReplies" placeholder="0">
        </div>
      </div>
      <button id="btnConfirm" class="btn-primary">Konfirmasi & Simpan ke Journal</button>
    </div>
  </section>

  <section class="block">
    <h2>Teks Mentah Hasil OCR (Debug)</h2>
    <div class="chart-box">
      <pre id="rawText" style="font-size:11px; color:var(--muted); white-space:pre-wrap; max-height:150px; overflow-y:auto;">Belum ada hasil.</pre>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="js/db.js"></script>
<script src="js/nav.js"></script>
<script src="js/uploader.js"></script>
</body>
</html>
